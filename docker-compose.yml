version: "3.9"
services:
  mcp-server:
    build: ./mcp-server
    ports: ["8080:8080"]
    env_file: .env
    environment:
      - PORT=8080

  backend:
    build: ./backend
    ports: ["8000:8000"]
    env_file: .env
    environment:
      - VALIDAIRISK_MCP_URL=http://mcp-server:8080/mcp/
    depends_on: [mcp-server]

  frontend:
    build: ./frontend
    ports: ["8501:8501"]
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on: [backend]
